<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6b4ce6"><title>Grace's Leerwereld</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Trebuchet MS',sans-serif;background:linear-gradient(#dff7ff,#f6efff);color:#293259;min-height:100vh}button,select{font:inherit;cursor:pointer}button{border:0;border-radius:15px;padding:13px 17px;font-weight:800;background:#6652d7;color:white}button:disabled{opacity:.45}.wrap{max-width:1000px;margin:auto;padding:18px}.top,.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}.pill,.card{background:white;border-radius:22px;padding:18px;box-shadow:0 5px 18px #273a6a16}.pill{padding:9px 13px;font-weight:800}.hero{background:linear-gradient(120deg,#6750d9,#bd69e3);color:white;border-radius:28px;padding:24px;display:flex;justify-content:space-between;align-items:center;margin:20px 0}.hero h1{margin:0}.mascot{font-size:75px;animation:float 2s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px) rotate(8deg)}}nav{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}nav button{background:white;color:#5344a4}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.island{min-height:140px;text-align:left;background:linear-gradient(135deg,#fff,#e9f7ff);color:#283a69;border:2px solid #e3ddff}.island b{display:block;font-size:19px;margin:8px 0}.card{margin:16px 0}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answers button{background:#edf1ff;color:#313b6c;border:2px solid #c6c8ef;min-height:70px;font-size:20px}.answers button:hover{background:#ddd8ff}.answers button:disabled{opacity:1}.answers button.good{background:#c6f5d3;border-color:#16a34a}.answers button.bad{background:#ffe2e2;border-color:#ef4444}.progress{height:12px;background:#e4e6f2;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#39bc9e}.muted{color:#65718b}.stat{font-size:30px;font-weight:900}.row{display:flex;gap:10px;flex-wrap:wrap}.secondary{background:#f2efff;color:#5344a4}.tag{display:inline-block;background:#fff4cb;border-radius:20px;padding:5px 10px}.clock{font-size:50px;font-weight:900;text-align:center;margin:25px}.map{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.map button:nth-child(2n){transform:translateY(20px)}.map button{border:3px solid #fff;box-shadow:0 6px 20px #7b72bd33}h2{margin-top:5px}@media(max-width:550px){.answers{grid-template-columns:1fr}.hero{padding:17px}.mascot{font-size:53px}.map{grid-template-columns:1fr}.map button:nth-child(2n){transform:none}}
</style></head><body><div class="wrap"><header class="top"><strong style="font-size:23px">🌈 Grace's Leerwereld</strong><div class="row"><span class="pill" id="stars">⭐ 0</span><span class="pill" id="level">🏆 Level 1</span></div></header><nav><button onclick="view('home')">🏠 Start</button><button onclick="view('map')">🗺️ Avonturenkaart</button><button onclick="view('daily')">🎯 Dagmissie</button><button onclick="view('parent')">📊 Voor ouders</button></nav><div id="app"></div></div><script>
const topics=[['clock','🕒','Klokkijken','Digitale tijden'],['plus','➕','Rijgen plus','Spring vooruit'],['minus','➖','Rijgen min','Spring achteruit'],['smart','🧠','Slim rekenen','Met te veel'],['tables','✖️','Tafels','Vermenigvuldigen'],['spell','🔤','Spelling','Goed geschreven'],['vocab','📚','Woordenschat','Betekenissen'],['english','🇬🇧','Engels','Nieuwe woorden'],['world','🌍','Wereldoriëntatie','Ontdek de wereld'],['reading','📖','Begrijpend lezen','Lees en denk']];
const bank={spell:[['Welke spelling is goed?',['onmiddelijk','onmiddellijk','onmidellijk','onmidelijk'],1,'Onmiddellijk schrijf je met dubbel d en dubbel l.'],['Welke spelling is goed?',['vrolijk','vroolijk','vrollek','vrolik'],0,'Vrolijk is de juiste spelling.']],vocab:[['Wat betekent dapper?',['Bang','Moedig','Moe','Boos'],1,'Dapper betekent moedig.'],['Wat betekent nieuwsgierig?',['Iets willen weten','Willen slapen','Hard rennen','Stil zijn'],0,'Nieuwsgierig betekent dat je iets wilt ontdekken.']],english:[['Wat betekent apple?',['Banaan','Peer','Appel','Druif'],2,'Apple is appel.'],['Wat betekent house?',['Huis','Boom','Boek','Auto'],0,'House is huis.']],world:[['Wat is de hoofdstad van Nederland?',['Utrecht','Rotterdam','Amsterdam','Den Haag'],2,'Amsterdam is de hoofdstad van Nederland.'],['Welke planeet is onze thuisplaneet?',['Mars','Aarde','Venus','Jupiter'],1,'Wij wonen op de aarde.']],reading:[['Mila neemt een paraplu mee omdat het regent. Waarom heeft Mila een paraplu?',['Omdat de zon schijnt','Omdat het regent','Omdat ze gaat zwemmen','Omdat ze gaat fietsen'],1,'De tekst zegt dat het regent.'],['Sam zet zijn fiets op slot voordat hij naar binnen gaat. Wat doet Sam eerst?',['Naar binnen gaan','Eten','Zijn fiets op slot zetten','Slapen'],2,'Sam zet eerst zijn fiets op slot.']]};
let data;try{data=JSON.parse(localStorage.getItem('grace_world_v1'))||{stars:0,history:[],daily:{},last:''}}catch(e){data={stars:0,history:[],daily:{},last:''}}let screen='home',session=null;const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem('grace_world_v1',JSON.stringify(data))}catch(e){}},rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),topic=id=>topics.find(t=>t[0]===id),today=()=>new Date().toLocaleDateString('sv-SE'),level=()=>1+Math.floor(data.stars/100),total=id=>data.history.filter(h=>h.id===id),percent=id=>{let a=total(id);return a.length?Math.round(a.filter(x=>x.ok).length/a.length*100):null};function view(s){screen=s;session=null;render()}function top(){ $('stars').textContent='⭐ '+data.stars;$('level').textContent='🏆 Level '+level()}function hero(){return '<section class="hero"><div><h1>Hoi Grace! 🌟</h1><p>Ga op avontuur met Luna en verzamel sterren!</p></div><span class="mascot">🦄</span></section>'}function home(){return hero()+'<section class="card"><h2>🎯 Jouw missie vandaag</h2><p>Speel drie opdrachten en verdien sterren!</p><button onclick="view(\'daily\')">Begin de dagmissie 🚀</button></section><h2>Ontdek de leerwerelden</h2>'+islands(false)}function islands(map){return '<div class="'+(map?'map':'grid')+'">'+topics.map(t=>'<button class="island" onclick="start(\''+t[0]+'\')"><span style="font-size:34px">'+t[1]+'</span><b>'+t[2]+'</b><small>'+t[3]+'</small><p>⭐ '+(percent(t[0])===null?'Nog niet geoefend':percent(t[0])+'% goed')+'</p></button>').join('')+'</div>'}function clockName(h,m){let twelve=x=>(x%12||12),n=['twaalf','een','twee','drie','vier','vijf','zes','zeven','acht','negen','tien','elf'];let w=x=>n[twelve(x)%12];return m===0?w(h)+' uur':m===15?'kwart over '+w(h):m===30?'half '+w(h+1):'kwart voor '+w(h+1)}function question(id,d){let a,b,correct,prompt,explanation,choices;if(id==='clock'){let h=rand(1,12),m=[0,15,30,45][rand(0,3)];correct=clockName(h,m);prompt='Hoe laat is het?  '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');choices=[correct,clockName(h+1,m),clockName(h,m===0?15:0),clockName(h+2,m)];explanation='Bij '+m+' minuten zeg je: '+correct+'.'}else if(['plus','minus','smart','tables'].includes(id)){if(id==='tables'){a=rand(2,10);b=rand(2,10);correct=a*b;prompt=a+' × '+b+' = ?';explanation=a+' groepjes van '+b+' zijn '+correct+'.'}else if(id==='plus'){a=rand(20,65);b=rand(12,d==='easy'?20:45);correct=a+b;prompt=a+' + '+b+' = ?';explanation='Splits '+b+' in tientallen en eenheden: '+a+' + '+(Math.floor(b/10)*10)+' + '+(b%10)+' = '+correct+'.'}else if(id==='minus'){a=rand(55,99);b=rand(12,Math.min(a-5,d==='easy'?25:55));correct=a-b;prompt=a+' − '+b+' = ?';explanation='Trek eerst de tientallen af, dan de eenheden: '+a+' − '+(Math.floor(b/10)*10)+' − '+(b%10)+' = '+correct+'.'}else{a=rand(32,78);b=[18,19,28,29][rand(0,3)];let minus=rand(0,1)===1;correct=minus?a-b:a+b;prompt=a+(minus?' − ':' + ')+b+' = ?';explanation=minus?a+' − '+(b+1)+' + 1 = '+correct:a+' + '+(b+(b%10===8?2:1))+' − '+(b%10===8?2:1)+' = '+correct;}choices=[correct,correct+1,correct-2,correct+10].map(String);correct=String(correct)}else{let x=bank[id][rand(0,bank[id].length-1)];prompt=x[0];choices=x[1];correct=x[1][x[2]];explanation=x[3]}choices=[...new Set(choices)];while(choices.length<4)choices.push(String(rand(10,99)));return {prompt,choices:shuffle(choices),correct:String(correct),explanation}}function start(id,d='normal',daily=false){session={id,d,daily,i:0,correct:0,questions:Array.from({length:daily?5:10},()=>question(id,d)),answered:false};screen='game';render()}function answer(i){if(!session||session.answered)return;let q=session.questions[session.i],ok=q.choices[i]===q.correct;session.answered=true;session.correct+=+ok;data.history.push({id:session.id,ok,date:today(),difficulty:session.d});if(ok)data.stars+=10;if(session.daily){data.daily[today()]=(data.daily[today()]||0)+1}save();render()}function next(){session.i++;session.answered=false;if(session.i>=session.questions.length){screen='done'}render()}function game(){let s=session,q=s.questions[s.i],chosen=s.answered;return '<section class="card"><div class="flex"><h2>'+topic(s.id)[1]+' '+topic(s.id)[2]+'</h2><span class="tag">Vraag '+(s.i+1)+' / '+s.questions.length+'</span></div><div class="progress"><div style="width:'+(s.i/s.questions.length*100)+'%"></div></div><h2 style="text-align:center;margin:30px 0">'+q.prompt+'</h2><div class="answers">'+q.choices.map((a,i)=>'<button '+(chosen?'disabled ':'')+'class="'+(chosen?(a===q.correct?'good':''):'')+'" onclick="answer('+i+')">'+a+'</button>').join('')+'</div>'+(chosen?'<p class="card"><b>✨ '+(data.history.at(-1).ok?'Goed gedaan!':'We oefenen verder!')+'</b><br>'+q.explanation+'</p><button onclick="next()">Volgende ➜</button>':'<p class="muted">Tip: denk rustig na. Je mag het proberen!</p>')+'</section>'}function done(){let s=session;return hero()+'<section class="card" style="text-align:center"><h2>🏆 Missie voltooid!</h2><div class="stat">'+s.correct+' / '+s.questions.length+'</div><p>Goed gewerkt! Luna is trots op je.</p><div class="row" style="justify-content:center"><button onclick="start(\''+s.id+'\',\''+s.d+'\')">Nog eens spelen</button><button class="secondary" onclick="view(\'map\')">Terug naar kaart</button></div></section>'}function daily(){let n=data.daily[today()]||0;return hero()+'<section class="card"><h2>🎯 Dagelijkse uitdaging</h2><p>Vandaag gespeeld: '+n+' vragen. Doel: 15 vragen.</p><div class="progress"><div style="width:'+Math.min(100,n/15*100)+'%"></div></div><p>'+(n>=15?'🎉 Dagdoel bereikt!':'Je kunt het!')+'</p><button onclick="start(\''+['clock','plus','minus'][Math.floor(n/5)%3]+'\',\'normal\',true)">Speel 5 vragen</button></section>'}function parent(){let n=data.history.length,c=data.history.filter(x=>x.ok).length;return '<section class="card"><h2>📊 Ouder-dashboard</h2><p class="muted">Dit overzicht gebruikt alleen antwoorden die op dit apparaat zijn gemaakt. Een laag aantal vragen is nog geen betrouwbare beoordeling.</p><div class="grid"><div class="pill">📝 <b>'+n+'</b> vragen</div><div class="pill">🎯 <b>'+(n?Math.round(c/n*100):0)+'%</b> goed</div><div class="pill">⭐ <b>'+data.stars+'</b> sterren</div></div></section><section class="card"><h2>Vaardigheden Groep 5</h2>'+topics.map(t=>{let a=total(t[0]),p=percent(t[0]);return '<div style="padding:12px;border-bottom:1px solid #eee"><b>'+t[1]+' '+t[2]+'</b><span style="float:right">'+(p===null?'Nog geen gegevens':p+'% ('+a.length+' vragen)')+'</span><div class="progress" style="margin-top:10px"><div style="width:'+(p||0)+'%"></div></div><small>'+(a.length<10?'Meer oefenen om een beeld te krijgen':p<65?'Extra oefenen aanbevolen':p<85?'Blijven oefenen':'Gaat goed!')+'</small></div>'}).join('')+'</section><section class="card"><h2>📌 Advies</h2><p>Begin met klokkijken, rijgen plus/min en slim rekenen, zoals in Grace’s schoolnotities.</p><p>De voortgang blijft lokaal op dit apparaat. Geen account of advertenties.</p></section>'}function render(){top();$('app').innerHTML=screen==='home'?home():screen==='map'?hero()+'<h2>🗺️ Avonturenkaart</h2>'+islands(true)+'<section class="card"><h2>🎚️ Moeilijkheid</h2><p>Kies de moeilijkheid wanneer je een missie start:</p><div class="row">'+['easy','normal','hard'].map((d,i)=>'<button class="secondary" onclick="difficulty=\''+d+'\'">'+['🌱 Makkelijk','⭐ Normaal','🔥 Moeilijk'][i]+'</button>').join('')+'</div></section>':screen==='daily'?daily():screen==='parent'?parent():screen==='game'?game():done()}let difficulty='normal';const originalStart=start;start=function(id,d,daily){return originalStart(id,d||difficulty,daily)};render();
</script></body></html>
