answer.wrong{background:#ffe2e2;border-color:#ec7676}.feedback{min-height:58px;border-radius:14px;padding:12px;margin-top:13px;background:#f4f2ff;font-weight:700;line-height:1.5}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.space{justify-content:space-between}.hidden{display:none!important}.stat{background:#f3f6ff;border-radius:17px;padding:15px}.stat b{font-size:27px;display:block}.meter{display:flex;align-items:center;gap:12px;margin:12px 0}.meter label{width:190px;max-width:42%;font-weight:800}.meter .progress{flex:1}.meter em{font-style:normal;font-weight:800;width:43px;text-align:right}.parentnote{background:#f0f6ff;border-left:5px solid #6554d8;border-radius:10px;padding:13px;line-height:1.6}.levelsel{background:white;border:2px solid #e0def7;border-radius:12px;padding:9px}.clock{width:165px;height:165px;margin:5px auto;display:block}.numberline{display:block;width:min(100%,420px);height:100px;margin:10px auto}.confetti{font-size:48px;text-align:center;animation:bob 1.4s infinite}.footer{text-align:center;color:#7985a0;font-size:12px;margin:30px 0}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#302a64;color:white;border-radius:16px;padding:14px 20px;z-index:10;box-shadow:0 7px 20px #2225;display:none}@media(max-width:600px){.hero{padding:18px;grid-template-columns:1fr 90px}.mascot{font-size:65px}.answers{grid-template-columns:1fr 1fr}.map{min-height:470px}.island{min-width:92px;padding:7px}.island span{font-size:27px}.shell{padding:10px}.card{padding:16px}}@media(prefers-reduced-motion:reduce){.mascot,.confetti{animation:none}}

'use strict';const KEY='grace_world_deluxe_v1',today=()=>new Date().toLocaleDateString('sv-SE');const subjects=[{id:'clock',name:'Klokkijken',icon:'🕒',desc:'Digitale en analoge tijd',group:'Rekenen'},{id:'add',name:'Rijgen plus',icon:'➕',desc:'Optellen op de getallenlijn',group:'Rekenen'},{id:'sub',name:'Rijgen min',icon:'➖',desc:'Aftrekken op de getallenlijn',group:'Rekenen'},{id:'round',name:'Slim rekenen',icon:'🎯',desc:'Rekenen met te veel',group:'Rekenen'},{id:'tables',name:'Tafels',icon:'✖️',desc:'Vermenigvuldigen',group:'Rekenen'},{id:'spelling',name:'Spelling',icon:'🔤',desc:'Goed geschreven woorden',group:'Taal'},{id:'vocab',name:'Woordenschat',icon:'📖',desc:'Wat betekenen woorden?',group:'Taal'},{id:'reading',name:'Begrijpend lezen',icon:'📚',desc:'Korte teksten en vragen',group:'Taal'},{id:'english',name:'Engels',icon:'🇬🇧',desc:'Engelse woorden leren',group:'Taal'},{id:'world',name:'Wereldoriëntatie',icon:'🌍',desc:'Natuur en de wereld',group:'Wereld'}];const facts={spelling:[['Welk woord is goed geschreven?','bibliotheek',['biblioteek','bibliotheek','biblotheek','bibiliotheek'],'Bibliotheek schrijf je met th.'],['Welk woord is goed geschreven?','vrolijk',['vrolik','vroolijk','vrolijk','vroelijk'],'Vrolijk eindigt op -lijk.'],['Welk woord is goed geschreven?','moeilijk',['moeilik','moeilijk','moeielijk','moeiluk'],'Moeilijk schrijf je met ei en -lijk.'],['Welk woord is goed geschreven?','schrijven',['schrijfen','schreiven','schrijven','schreijven'],'Schrijven schrijf je met ij en v.'],['Welk woord is goed geschreven?','vriendelijk',['vrindelijk','vriendelijk','vriendelik','vriendelijkk'],'Vriendelijk bevat vriend + elijk.']],vocab:[['Wat betekent "nieuwsgierig"?','Je wilt graag iets weten',['Je bent boos','Je wilt graag iets weten','Je bent slaperig','Je bent stil'],'Nieuwsgierig betekent dat je meer wilt weten.'],['Wat is een "tegenstelling" van warm?','koud',['heet','zonnig','koud','droog'],'Warm en koud zijn tegenstellingen.'],['Wat betekent "voorzichtig"?','Met aandacht om ongelukken te voorkomen',['Heel snel','Met aandacht om ongelukken te voorkomen','Heel luid','Zonder kijken'],'Voorzichtig betekent dat je goed oplet.'],['Wat is een ander woord voor "blij"?','vrolijk',['verdrietig','boos','vrolijk','moe'],'Blij en vrolijk betekenen ongeveer hetzelfde.']],reading:[['Sara fietst naar school. Het regent, dus ze trekt een regenjas aan. Waarom trekt Sara een regenjas aan?','Omdat het regent',['Omdat het sneeuwt','Omdat ze gaat zwemmen','Omdat het regent','Omdat ze gaat slapen'],'De tekst vertelt dat het regent.'],['Milan plant een zaadje. Hij geeft het elke dag water. Wat doet Milan elke dag?','Water geven',['Het zaadje opeten','Water geven','Een fiets repareren','Naar de winkel gaan'],'In de tekst staat dat Milan elke dag water geeft.'],['Noor neemt een boek mee naar de bibliotheek. Ze wil het terugbrengen. Waarom gaat Noor naar de bibliotheek?','Om een boek terug te brengen',['Om een boek terug te brengen','Om te sporten','Om te koken','Om te zwemmen'],'Noor wil haar boek terugbrengen.']],english:[['Wat betekent "apple"?','appel',['peer','appel','banaan','druif'],'Apple is Engels voor appel.'],['Wat betekent "window"?','raam',['deur','vloer','raam','dak'],'Window betekent raam.'],['Wat is "hond" in het Engels?','dog',['cat','duck','dog','horse'],'Hond is dog in het Engels.'],['Wat betekent "yellow"?','geel',['groen','blauw','rood','geel'],'Yellow betekent geel.'],['Wat betekent "school"?','school',['winkel','school','park','huis'],'School betekent school.']],world:[['Welke planeet is onze thuisplaneet?','Aarde',['Mars','Venus','Aarde','Jupiter'],'Wij wonen op de aarde.'],['Wat hebben planten nodig om te groeien?','Water en licht',['Alleen stenen','Water en licht','Plastic','Zand zonder water'],'Planten hebben onder andere water en licht nodig.'],['Welk dier is een zoogdier?','dolfijn',['haai','kikker','dolfijn','vlinder'],'Een dolfijn is een zoogdier.'],['Welke richting komt de zon ongeveer op?','oosten',['noorden','westen','zuiden','oosten'],'De zon komt ongeveer in het oosten op.']]};function fresh(){return{stars:0,xp:0,played:0,correct:0,streak:0,lastDay:'',skills:{},daily:{},history:[],questionStats:{},sound:true}}let state;try{state={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state=fresh()}let page='home',session=null;function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}cloudSave()}function level(){return Math.floor(state.xp/100)+1}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display='none',2500)}let audioCtx=null,audioMaster=null,audioLast=0;
function refreshPage(){save();window.location.reload()}
function audioEngine(){
 const C=window.AudioContext||window.webkitAudioContext;
 if(!C)throw new Error('Dit apparaat ondersteunt geen Web Audio');
 if(!audioCtx||audioCtx.state==='closed'){
  audioCtx=new C();audioMaster=audioCtx.createGain();audioMaster.gain.value=.68;
  const limiter=audioCtx.createDynamicsCompressor();
  limiter.threshold.value=-18;limiter.knee.value=12;limiter.ratio.value=5;limiter.attack.value=.004;limiter.release.value=.18;
  audioMaster.connect(limiter);limiter.connect(audioCtx.destination)
 }
 if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
 return audioCtx
}
function tone(hz,at,dur,vol=.12,type='sine',endHz=0){
 const c=audioEngine(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+Math.max(0,at);
 o.type=type;o.frequency.setValueAtTime(hz,t);
 if(endHz)o.frequency.exponentialRampToValueAtTime(Math.max(20,endHz),t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,vol),t+.014);
 g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(audioMaster);o.start(t);o.stop(t+dur+.035)
}
function sparkle(at=0){
 const c=audioEngine(),duration=.32,t=c.currentTime+at;
 const buffer=c.createBuffer(1,Math.floor(c.sampleRate*duration),c.sampleRate),data=buffer.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.pow(1-i/data.length,2);
 const source=c.createBufferSource(),filter=c.createBiquadFilter(),g=c.createGain();
 source.buffer=buffer;filter.type='highpass';filter.frequency.value=2800;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+duration);
 source.connect(filter);filter.connect(g);g.connect(audioMaster);source.start(t);source.stop(t+duration)
}
function sfx(kind){
 if(!state.sound)return;
 try{
  audioEngine();
  if(kind==='correct'){
   tone(660,0,.11,.13,'triangle',880);tone(880,.11,.14,.14,'sine');tone(1174,.23,.24,.12,'sine');sparkle(.17)
  }else if(kind==='wrong'){
   tone(420,0,.14,.08,'sine',370);tone(370,.15,.19,.07,'sine',330)

   tone(523,.43,1.15,.07,'triangle');tone(659,.43,1.15,.06,'sine');sparkle(.45);sparkle(.98);sparkle(1.35)
  }else if(kind==='levelup'){
   [[659,0],[784,.13],[988,.27],[1175,.4],[1568,.58]].forEach(([hz,t],i)=>tone(hz,t,i===4?.65:.22,.15,'triangle'));

  }
 }catch(e){console.warn('Game sound unavailable:',e)}
}
function sayFeedback(ok,completion=false){
 if(!state.sound||!('speechSynthesis' in window))return;
 try{
  const synth=window.speechSynthesis;synth.cancel();
  const phrases=completion?['Hoera! Missie voltooid! Wat knap van jou!','Geweldig gedaan! Je hebt je missie afgerond!']:ok?['Super gedaan!','Yes! Goed zo!','Fantastisch!','Wat knap!']:['Goed geprobeerd!','Geeft niks, je leert ervan!','Bijna! Volgende keer lukt het!'];
  const u=new SpeechSynthesisUtterance(phrases[Math.floor(Math.random()*phrases.length)]);
  u.lang='nl-NL';u.rate=1.06;u.pitch=1.15;u.volume=.85;
  const voices=synth.getVoices(),dutch=voices.find(v=>v.lang.toLowerCase()==='nl-nl')||voices.find(v=>v.lang.toLowerCase().startsWith('nl'));
  if(dutch)u.voice=dutch;
  synth.speak(u)
 }catch(e){console.warn('Dutch voice unavailable:',e)}
}

function celebrate(ok){

 if(ok){const burst=document.createElement('div');burst.className='sparkle-burst';burst.textContent='✨ ⭐ 🎉 ⭐ ✨';f.prepend(burst)}

function selectQuestions(id,d){
 const existing=window.GraceQuestionBank?.get(id,d)||[];
 let pool=existing.length?existing.map(x=>({...x,visual:x.passage?'<div class="card" style="background:#f1f7ff;text-align:left;line-height:1.8;font-size:18px"><b>📖 Lees de tekst:</b><p>'+esc(x.passage)+'</p></div>':''})):null;
 if(!pool){pool=[];const seen=new Set();for(let tries=0;tries<1600&&pool.length<200;tries++){let q=generate(id,d);q.subject=id;let key=stableQuestionId(q,d);if(!seen.has(key)){seen.add(key);pool.push({...q,id:key})}}}
 const stats=questionStats(),now=Date.now(),due=[],unseen=[],review=[];if(!existing.length){for(const [key,rec] of Object.entries(stats)){if(rec.subject===id&&rec.level===d&&rec.question&&rec.dueAt<=now&&!pool.some(q=>q.id===key))pool.push({...rec.question,id:key})}}
 for(const q of pool){const k=stats[q.id];if(!k||!k.attempts)unseen.push(q);else if(k.dueAt&&k.dueAt<=now)due.push(q);else review.push(q)}
 const shuffleCopy=a=>a.map(x=>({x,r:Math.random()})).sort((a,b)=>a.r-b.r).map(z=>z.x);
 due.sort((a,b)=>(stats[a.id]?.dueAt||0)-(stats[b.id]?.dueAt||0));
 review.sort((a,b)=>(stats[a.id]?.lastAt||0)-(stats[b.id]?.lastAt||0));
 const selected=[],used=new Set();
 const add=(arr,limit=10)=>{for(const q of arr){if(selected.length>=limit)break;if(!used.has(q.id)){selected.push(q);used.add(q.id)}}};
 add(due,3);add(shuffleCopy(unseen),10);add(due,10);add(review,10);
 return selected.slice(0,10)
}
function start(id,override='auto'){
 let sk=skill(id),d=override==='auto'?Math.max(1,Math.min(3,sk.level)):Number(override);
 session={id,d,items:selectQuestions(id,d),index:0,correct:0,answered:false};
 if(!session.items.length){alert('Er zijn nog geen vragen voor dit onderwerp.');return}
 page='game';document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));render()
}
function recordQuestion(item,correct,d){
 const stats=questionStats(),key=item.id||stableQuestionId(item,d),old=stats[key]||{attempts:0,correct:0,streak:0};
 const streak=correct?(old.streak||0)+1:0,days=correct?[0,1,3,7,14,30][Math.min(5,streak)]:1;
 const record={attempts:(old.attempts||0)+1,correct:(old.correct||0)+Number(correct),streak,mastery:Math.min(1,Math.max(0,(correct?(old.mastery||0)+.2:(old.mastery||0)-.22))),lastAt:Date.now(),dueAt:Date.now()+days*86400000,subject:item.subject||session.id,level:d,question:{id:key,q:item.q,answer:item.answer,options:item.options,explain:item.explain,visual:item.visual||''}};
 stats[key]=record;
 if(cloudUser&&cloudClient){
  const payload={user_id:cloudUser.id,question_id:key,subject_id:record.subject,difficulty:d,attempts:record.attempts,correct:record.correct,mastery:record.mastery,due_at:new Date(record.dueAt).toISOString(),last_answered_at:new Date(record.lastAt).toISOString(),updated_at:new Date().toISOString()};
  cloudClient.from('question_progress').upsert(payload,{onConflict:'user_id,question_id'}).then(({error})=>{if(error)console.warn('Question mastery sync:',error.message)})
 }
}
function game(){let x=session;if(x.index>=x.items.length)return finishView();let item=x.items[x.index],name=subjects.find(s=>s.id===x.id);return `<section class="card"><div class="row space"><div><b>${name.icon} ${name.name}</b><div class="muted">${['','Beginner','Gevorderd','Uitdaging'][x.d]} • Vraag ${x.index+1} van 10</div></div><button class="secondary" onclick="if(confirm('Missie verlaten?'))go('subjects')">✕ Stoppen</button></div><div class="progress" style="margin-top:18px"><div style="width:${x.index*10}%"></div></div><div class="row space" style="margin-top:14px"><span>⭐ ${x.correct} goed</span><span>🦄 Luna helpt je!</span></div><div class="question" style="font-size:${item.q.length>75?'21px':'clamp(25px,4vw,36px)'}">${esc(item.q)}</div>${item.visual}<div class="answers">${item.options.map((o,i)=>`<button class="answer" id="ans${i}" onclick="answer(${i})">${esc(o)}</button>`).join('')}</div><div class="feedback hidden" id="feedback"></div><div class="row space" style="margin-top:15px"><button class="secondary" id="hint" onclick="hint()">💡 Hint</button><button class="primary hidden" id="next" onclick="nextQuestion()">Volgende ➜</button></div></section>`}function hint(){let it=session.items[session.index];document.getElementById('feedback').classList.remove('hidden');document.getElementById('feedback').textContent=['clock'].includes(it.id)?'Kijk eerst naar de uren en daarna naar de minuten.':'add'===it.id||'sub'===it.id?'Splits het tweede getal in tientallen en eenheden.':'round'===it.id?'Rond af naar een makkelijk tiental en corrigeer daarna.':'tables'===it.id?'Denk aan groepjes met evenveel.':'Lees de vraag nog eens rustig en vergelijk de antwoorden.'}function answer(i){if(session.answered)return;let it=session.items[session.index],value=it.options[i],ok=value===it.answer;session.answered=true;session.correct+=Number(ok);state.played++;state.correct+=Number(ok);state.xp+=ok?10:2;state.stars+=ok?10:2;let s=skill(session.id);s.attempts++;s.correct+=Number(ok);state.skills[session.id]=s;let daily=state.daily[today()]||(state.daily[today()]={});if(ok)daily.correct=(daily.correct||0)+1;if(session.id==='clock')daily.clock=(daily.clock||0)+1;rewardDaily(daily);recordQuestion(it,ok,session.d);save();sound(ok);renderTop();document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(it.options[j]===it.answer)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});let f=document.getElementById('feedback');f.classList.remove('hidden');f.textContent=(ok?'🎉 Super gedaan! ⭐ +10 sterren! ':'🌱 Goed geprobeerd! ⭐ +2 sterren voor je inzet! ')+it.explain;celebrate(ok);document.getElementById('next').classList.remove('hidden');document.getElementById('hint').classList.add('hidden')}function rewardDaily(d){for(let c of challengeDefs()){if((d[c.id]||0)>=c.target&&!d['reward_'+c.id]){d['reward_'+c.id]=true;state.stars+=15;toast('🎁 Daguitdaging voltooid! +15 sterren')}}save()}function nextQuestion(){sfx('tap');session.index++;session.answered=false;if(session.index>=10){complete();sfx('complete');sayFeedback(true,true)}render()}function complete(){let x=session,s=skill(x.id);const oldLevel=s.level;if(x.correct>=8&&s.level<3)s.level++;if(x.correct<=4&&s.level>1)s.level--;x.levelUp=s.level>oldLevel;state.skills[x.id]=s;let d=state.daily[today()]||(state.daily[today()]={});d.play=(d.play||0)+1;rewardDaily(d);if(state.lastDay!==today()){let yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);state.streak=state.lastDay===yesterday.toLocaleDateString('sv-SE')?state.streak+1:1;state.lastDay=today()}state.history.push({day:today(),id:x.id,correct:x.correct,total:10,difficulty:x.d});state.history=state.history.slice(-250);save();renderTop()}function finishView(){let x=session,stars=x.correct*10+(10-x.correct)*2;return `<section class="card" style="text-align:center"><div class="confetti">🎉🦄🎉</div><h2>🎊 Missie voltooid! 🎊</h2>${x.levelUp?'<div style="font-size:25px;font-weight:900;color:#6746bd">🚀 Nieuw moeilijkheidsniveau ontgrendeld!</div>':''}<button class="secondary" style="margin:12px" onclick="sfx('complete');sayFeedback(true,true)">🎺 Speel feestgeluid opnieuw</button><p style="font-size:23px;font-weight:900">${x.correct} van de 10 goed!</p><p>Je verdiende ${stars} sterren met je antwoorden! ⭐</p><p>${x.correct>=8?'Geweldig! Je bent klaar voor een grotere uitdaging.':x.correct>=5?'Goed gewerkt! Nog een keer oefenen maakt je sterker.':'Blijf proberen. Elke poging helpt je leren!'}</p><div class="row" style="justify-content:center"><button class="primary" onclick="start('${x.id}')">🔄 Nog een missie</button><button class="secondary" onclick="go('map')">🗺️ Naar de kaart</button></div></section>`}function render(){renderTop();document.getElementById('app').innerHTML=page==='home'?home():page==='map'?map():page==='subjects'?subjectsPage():page==='rewards'?awards():page==='parent'?parent():page==='game'?game():home()}render();initCloud();</script></body></html>
